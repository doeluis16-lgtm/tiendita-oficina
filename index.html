<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendita de Oficina TI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS para exportar Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white">

  <!-- ==================== PANTALLA DE LOGIN ==================== -->
  <div id="pantalla-login" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden backdrop-blur-xl">
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-600/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-emerald-600/20 rounded-full blur-2xl pointer-events-none"></div>

      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/30 text-3xl">
          🏪
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">Tiendita de Oficina</h1>
        <p class="text-xs text-slate-400 mt-1">Ingresa credenciales del sistema TI</p>
      </div>

      <form onsubmit="event.preventDefault(); validarLogin();" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Usuario</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input type="text" id="login-user" placeholder="Ej. Systemas" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-10 pr-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input type="password" id="login-pass" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-10 pr-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>

        <div id="login-error" class="hidden text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400 p-2.5 rounded-xl text-center font-medium">
          <i class="fa-solid fa-circle-exclamation mr-1"></i>Usuario o contraseña incorrectos
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm flex items-center justify-center space-x-2">
          <span>Iniciar Sesión</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== APLICACIÓN PRINCIPAL ==================== -->
  <div id="app-principal" class="hidden pb-20">

    <!-- ENCABEZADO -->
    <header class="bg-slate-900/80 border-b border-slate-800/80 p-4 sticky top-0 z-30 backdrop-blur-md">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-indigo-600/30 border border-indigo-500/40 rounded-xl flex items-center justify-center text-xl">
            🏪
          </div>
          <div>
            <h1 class="text-base font-bold text-white leading-tight">Tiendita TI</h1>
            <p class="text-[11px] text-emerald-400 font-semibold flex items-center">
              <span class="w-2 h-2 bg-emerald-400 rounded-full mr-1.5 animate-pulse"></span>En línea
            </p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="abrirModalUsuario()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-2.5 py-1.5 rounded-xl transition flex items-center shadow-md">
            <i class="fa-solid fa-user-plus mr-1"></i>+User
          </button>
          <button onclick="cerrarSesion()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-xl transition border border-slate-700">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- SELECTOR DE COMPRADOR ACTIVO -->
    <section class="bg-slate-900/40 border-b border-slate-800/60 p-3">
      <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-2">
          <label class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider">
            <i class="fa-solid fa-user-check mr-1"></i>¿Quién está comprando?
          </label>
          <span id="label-comprador-activo" class="text-xs font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20"></span>
        </div>
        <div id="lista-compradores" class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
          <!-- Render dinámico de botones de usuario -->
        </div>
      </div>
    </section>

    <!-- NAVEGACIÓN -->
    <nav class="max-w-md mx-auto p-3 grid grid-cols-2 gap-2 text-center text-xs font-bold">
      <button onclick="cambiarPestana('catalogo')" id="tab-catalogo" class="py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-store text-sm"></i>
        <span>Catálogo & Registro</span>
      </button>
      <button onclick="cambiarPestana('cuentas')" id="tab-cuentas" class="py-2.5 px-3 rounded-xl bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center space-x-2 border border-slate-800">
        <i class="fa-solid fa-file-excel text-sm"></i>
        <span>Cuentas & Excel</span>
      </button>
    </nav>

    <!-- CONTENIDO CONTENEDOR -->
    <main class="max-w-md mx-auto px-3">

      <!-- PESTAÑA 1: CATÁLOGO DE PRODUCTOS -->
      <section id="sec-catalogo" class="space-y-3">
        <!-- BUSCADOR -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
          <input type="text" id="input-busqueda" oninput="filtrarProductos()" placeholder="Buscar producto (ej. Cocas, Papas...)" class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <!-- GRID DE ARTÍCULOS -->
        <div id="grid-catalogo" class="grid grid-cols-2 gap-2.5">
          <!-- Render dinámico de tarjetas de productos -->
        </div>
      </section>

      <!-- PESTAÑA 2: CUENTAS Y EXCEL -->
      <section id="sec-cuentas" class="hidden space-y-4">
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-white">Resumen de Deudas</h2>
            <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl shadow-lg shadow-emerald-600/20 flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-file-excel text-sm"></i>
              <span>Exportar .xlsx</span>
            </button>
          </div>

          <div id="contenedor-deudas" class="space-y-2.5">
            <!-- Render dinámico de deudas -->
          </div>

          <button onclick="reiniciarSemana()" class="w-full mt-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Reiniciar Deudas a $0.00</span>
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- NOTIFICACIÓN TIPO TOAST AL REGISTRAR -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-indigo-500/50 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-4 max-w-xs w-full">
    <div class="w-9 h-9 bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-xl flex items-center justify-center text-lg flex-shrink-0">
      <i class="fa-solid fa-plus"></i>
    </div>
    <div class="overflow-hidden text-xs">
      <p id="toast-prod" class="font-bold text-white truncate">Producto</p>
      <p id="toast-usr" class="text-slate-400 truncate">Asignado a Luis E.</p>
    </div>
  </div>

  <!-- MODAL: AGREGAR INTEGRANTE -->
  <div id="modal-usuario" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm relative shadow-2xl">
      <button onclick="cerrarModalUsuario()" class="absolute top-4 right-4 text-slate-500 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-base font-bold text-white mb-1"><i class="fa-solid fa-user-plus text-indigo-400 mr-2"></i>Nuevo Integrante</h3>
      <p class="text-xs text-slate-400 mb-4">Ingresa el nombre de la persona</p>
      
      <input type="text" id="input-nuevo-usuario" placeholder="Ej. Roberto, Sofía..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-xs focus:outline-none focus:border-indigo-500 mb-4">

      <div class="flex space-x-2">
        <button onclick="cerrarModalUsuario()" class="w-1/2 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl transition text-xs">Cancelar</button>
        <button onclick="guardarNuevoUsuario()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT CON LÓGICA DE LA APLICACIÓN -->
  <script>
    // LISTA DE EMPLEADOS CON LUIS E. INCLUIDO
    const empleadosIniciales = ["Luis E.", "Lalo", "Javi", "David", "Ivan", "cesar", "Beto", "mario", "Venta Pública"];
    
    // CATÁLOGO DE PRODUCTOS
    const productosIniciales = [
      { id: "PROD-001", nombre: "Cocas", precio: 18.00, imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400" },
      { id: "PROD-002", nombre: "Papas", precio: 22.00, imagen: "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=400" },
      { id: "PROD-003", nombre: "Maruchan", precio: 18.00, imagen: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" },
      { id: "PROD-004", nombre: "Palomitas", precio: 15.00, imagen: "https://images.unsplash.com/photo-1578849278619-e73505e9610f?w=400" },
      { id: "PROD-005", nombre: "Chocoroles", precio: 20.00, imagen: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=400" },
      { id: "PROD-006", nombre: "Peñafiel", precio: 16.00, imagen: "https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400" },
      { id: "PROD-007", nombre: "M&M's", precio: 22.00, imagen: "https://images.unsplash.com/photo-1581798459219-318e76aecc7b?w=400" },
      { id: "PROD-008", nombre: "Snickers", precio: 20.00, imagen: "https://images.unsplash.com/photo-1599599810769-bcde5a160d32?w=400" },
      { id: "PROD-009", nombre: "Milky Way", precio: 20.00, imagen: "https://images.unsplash.com/photo-1582293041079-7814c2f12063?w=400" },
      { id: "PROD-010", nombre: "Mamuts", precio: 12.00, imagen: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=400" },
      { id: "PROD-011", nombre: "Lechitas", precio: 14.00, imagen: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400" },
      { id: "PROD-012", nombre: "Perrier", precio: 30.00, imagen: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=400" },
      { id: "PROD-013", nombre: "Helado", precio: 25.00, imagen: "https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=400" }
    ];

    let empleados = JSON.parse(localStorage.getItem("tiendita_empleados")) || empleadosIniciales;
    let productos = JSON.parse(localStorage.getItem("tiendita_productos")) || productosIniciales;
    let consumos = JSON.parse(localStorage.getItem("tiendita_consumos")) || [];
    let compradorActivo = empleados[0] || "Luis E.";

    // INICIALIZAR SESIÓN Y VISTAS
    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("tiendita_session") === "true") {
        document.getElementById("pantalla-login").classList.add("hidden");
        document.getElementById("app-principal").classList.remove("hidden");
      }
      renderizarCompradores();
      renderizarGridCatalogo(productos);
      renderizarDeudas();
    });

    // LOGIN & SESIÓN
    function validarLogin() {
      const u = document.getElementById("login-user").value.trim();
      const p = document.getElementById("login-pass").value.trim();
      
      if (u === "Systemas" && p === "TiendaTI2026") {
        sessionStorage.setItem("tiendita_session", "true");
        document.getElementById("pantalla-login").classList.add("hidden");
        document.getElementById("app-principal").classList.remove("hidden");
      } else {
        document.getElementById("login-error").classList.remove("hidden");
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem("tiendita_session");
      location.reload();
    }

    // SONIDO BEEP AL COBRAR
    function reproducirBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    // COMPRADOR ACTIVO
    function renderizarCompradores() {
      const container = document.getElementById("lista-compradores");
      document.getElementById("label-comprador-activo").innerText = compradorActivo;
      
      container.innerHTML = empleados.map(emp => `
        <button onclick="seleccionarComprador('${emp}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition border ${compradorActivo === emp ? 'bg-indigo-600 text-white border-indigo-400 shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'}">
          👤 ${emp}
        </button>
      `).join("");
    }

    function seleccionarComprador(nombre) {
      compradorActivo = nombre;
      renderizarCompradores();
    }

    // REGISTRAR CONSUMO DE PRODUCTO
    function registrarConsumo(producto) {
      reproducirBeep();
      if (navigator.vibrate) navigator.vibrate(80);

      consumos.push({
        empleado: compradorActivo,
        productoId: producto.id,
        nombreProducto: producto.nombre,
        precio: producto.precio,
        fecha: new Date().toISOString()
      });

      localStorage.setItem("tiendita_consumos", JSON.stringify(consumos));
      renderizarDeudas();
      mostrarToast(producto.nombre, compradorActivo);
    }

    // TOAST NOTIFICACIÓN
    let timerToast = null;
    function mostrarToast(prodNombre, usrNombre) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-prod").innerText = prodNombre;
      document.getElementById("toast-usr").innerText = `+$${productos.find(p=>p.nombre===prodNombre).precio.toFixed(2)} ➔ ${usrNombre}`;

      toast.classList.remove("opacity-0", "pointer-events-none", "translate-y-4");
      
      clearTimeout(timerToast);
      timerToast = setTimeout(() => {
        toast.classList.add("opacity-0", "pointer-events-none", "translate-y-4");
      }, 2000);
    }

    // RENDERIZAR GRID DE PRODUCTOS
    function renderizarGridCatalogo(lista) {
      const container = document.getElementById("grid-catalogo");
      container.innerHTML = lista.map(p => `
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-2.5 flex flex-col justify-between hover:border-indigo-500/50 transition shadow-lg group">
          <div class="relative w-full h-24 rounded-xl overflow-hidden mb-2 bg-slate-950">
            <img src="${p.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <button onclick="editarPrecio('${p.id}')" class="absolute top-1.5 right-1.5 bg-slate-950/80 text-emerald-400 text-[10px] font-black px-2 py-0.5 rounded-lg border border-emerald-500/30 backdrop-blur-sm">
              $${p.precio.toFixed(2)} ✏️
            </button>
          </div>
          <div>
            <p class="text-xs font-bold text-white leading-tight mb-2 truncate">${p.nombre}</p>
            <button onclick="registrarConsumo(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="w-full bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 font-bold py-1.5 rounded-xl text-xs transition flex items-center justify-center space-x-1">
              <i class="fa-solid fa-cart-plus text-[10px]"></i>
              <span>Agregar</span>
            </button>
          </div>
        </div>
      `).join("");
    }

    function filtrarProductos() {
      const texto = document.getElementById("input-busqueda").value.toLowerCase();
      const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
      renderizarGridCatalogo(filtrados);
    }

    function editarPrecio(id) {
      const p = productos.find(item => item.id === id);
      if (!p) return;
      const nuevo = prompt(`Nuevo precio para ${p.nombre}:`, p.precio);
      if (nuevo !== null && !isNaN(parseFloat(nuevo))) {
        p.precio = parseFloat(nuevo);
        localStorage.setItem("tiendita_productos", JSON.stringify(productos));
        renderizarGridCatalogo(productos);
      }
    }

    // RENDERIZAR DEUDAS Y EXCEL
    function renderizarDeudas() {
      const container = document.getElementById("contenedor-deudas");
      let totalGeneral = 0;

      container.innerHTML = empleados.map(emp => {
        const misConsumos = consumos.filter(c => c.empleado === emp);
        const totalEmp = misConsumos.reduce((sum, c) => sum + c.precio, 0);
        totalGeneral += totalEmp;

        const conteo = {};
        misConsumos.forEach(c => {
          conteo[c.nombreProducto] = (conteo[c.nombreProducto] || 0) + 1;
        });
        const desglose = Object.entries(conteo).map(([nom, cant]) => `${cant}x ${nom}`).join(", ") || "Sin consumos registrados";

        return `
          <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
            <div class="overflow-hidden pr-2">
              <p class="font-bold text-white text-xs">👤 ${emp}</p>
              <p class="text-[11px] text-slate-500 truncate">${desglose}</p>
            </div>
            <span class="font-extrabold text-xs px-2.5 py-1 rounded-lg ${totalEmp > 0 ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'text-slate-600 bg-slate-900'}">$${totalEmp.toFixed(2)}</span>
          </div>
        `;
      }).join("") + `
        <div class="bg-indigo-950/60 border border-indigo-500/40 p-3.5 rounded-xl flex justify-between items-center mt-3">
          <span class="font-bold text-indigo-200 text-xs uppercase">Total General Oficina:</span>
          <span class="font-black text-emerald-400 text-lg">$${totalGeneral.toFixed(2)}</span>
        </div>
      `;
    }

    function exportarExcel() {
      const datosExcel = [
        ["Nombre del Empleado", "Productos Consumidos", "Cantidad Total", "Total a Pagar ($)"]
      ];

      let sumaOficina = 0;

      empleados.forEach(emp => {
        const misConsumos = consumos.filter(c => c.empleado === emp);
        const totalEmp = misConsumos.reduce((sum, c) => sum + c.precio, 0);
        sumaOficina += totalEmp;

        const conteo = {};
        misConsumos.forEach(c => {
          conteo[c.nombreProducto] = (conteo[c.nombreProducto] || 0) + 1;
        });
        const listaTexto = Object.entries(conteo).map(([nom, cant]) => `${cant}x ${nom}`).join(", ") || "Ninguno";

        datosExcel.push([emp, listaTexto, misConsumos.length, totalEmp]);
      });

      datosExcel.push(["", "", "", ""]);
      datosExcel.push(["TOTAL GENERAL DE LA OFICINA", "", "", sumaOficina]);

      const hoja = XLSX.utils.aoa_to_sheet(datosExcel);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, "Cierre Semanal");

      XLSX.writeFile(libro, `Cierre_Tiendita_TI_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // MODAL USUARIO NUEVO
    function abrirModalUsuario() {
      document.getElementById("input-nuevo-usuario").value = "";
      document.getElementById("modal-usuario").classList.remove("hidden");
    }

    function cerrarModalUsuario() {
      document.getElementById("modal-usuario").classList.add("hidden");
    }

    function guardarNuevoUsuario() {
      const nombre = document.getElementById("input-nuevo-usuario").value.trim();
      if (!nombre) return;
      if (!empleados.includes(nombre)) {
        empleados.push(nombre);
        localStorage.setItem("tiendita_empleados", JSON.stringify(empleados));
        compradorActivo = nombre;
        renderizarCompradores();
        renderizarDeudas();
      }
      cerrarModalUsuario();
    }

    // CAMBIO DE PESTAÑAS & REINICIO
    function cambiarPestana(p) {
      document.getElementById("sec-catalogo").classList.toggle("hidden", p !== "catalogo");
      document.getElementById("sec-cuentas").classList.toggle("hidden", p !== "cuentas");

      document.getElementById("tab-catalogo").className = p === "catalogo" 
        ? "py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2"
        : "py-2.5 px-3 rounded-xl bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center space-x-2 border border-slate-800";

      document.getElementById("tab-cuentas").className = p === "cuentas" 
        ? "py-2.5 px-3 rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2"
        : "py-2.5 px-3 rounded-xl bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center space-x-2 border border-slate-800";
    }

    function reiniciarSemana() {
      if (confirm("¿Confirmas reiniciar todas las deudas acumuladas a $0.00?")) {
        consumos = [];
        localStorage.removeItem("tiendita_consumos");
        renderizarDeudas();
      }
    }
  </script>
</body>
</html>
